<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neural Bloom · living white signals</title><style>*{box-sizing:border-box}body{margin:0;background:#0d0d12;color:#fff;font:13px system-ui,sans-serif}header{min-height:64px;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #ffffff16}header span{opacity:.45;margin-left:12px;font-size:11px}nav{display:flex;gap:8px}button,a{color:inherit;background:transparent;border:1px solid #ffffff26;border-radius:5px;padding:8px 12px;cursor:pointer;font:inherit;text-decoration:none}.stage{height:calc(100svh - 128px);min-height:300px;display:grid;place-items:center;overflow:hidden}.stage.checker{background:repeating-conic-gradient(#35353c 0 25%,#292930 0 50%) 50%/24px 24px}.stage.light{background:#e4dfea}object{width:100%;height:100%;max-width:960px;max-height:640px}button:hover,a:hover{background:#ffffff15}footer{height:64px;display:flex;align-items:center;justify-content:center;gap:12px;border-top:1px solid #ffffff16}footer button{border-color:transparent;color:#9f9fa8}footer button.active{background:#ffffff0c;color:white}#time{font:11px monospace;color:#96969f;min-width:65px}@media(max-width:650px){header span{display:none}header{padding:12px}button,a{padding:7px;font-size:11px}footer{gap:4px}footer button{font-size:10px}}</style><header><div>Neural Bloom <span>32-second seamless loop · transparent SVG</span></div><nav><button id="pause">Pause</button><button id="bg">Background</button><a href="neural-bloom.svg" download>Download SVG</a></nav></header><div class="stage" id="stage"><object id="art" data="neural-bloom.svg" type="image/svg+xml" aria-label="Continuously rotating neural simulation"></object></div><footer><button data-time="4">01 / Neural fibers</button><button data-time="12">02 / EEG signals</button><button data-time="20">03 / Particles</button><button data-time="28">04 / Numerical orbits</button><span id="time">00 / 32 s</span></footer><script>const art=document.getElementById('art'),pause=document.getElementById('pause');let paused=false,bg=0;pause.onclick=()=>{paused=!paused;const s=art.contentDocument.documentElement;paused?s.pauseAnimations():s.unpauseAnimations();pause.textContent=paused?'Play':'Pause'};document.getElementById('bg').onclick=()=>{bg=(bg+1)%3;document.getElementById('stage').className='stage '+['','checker','light'][bg]};document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>art.contentDocument.documentElement.setCurrentTime(+b.dataset.time));art.onload=()=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches){paused=true;art.contentDocument.documentElement.pauseAnimations();pause.textContent='Play'};setInterval(()=>{let t=art.contentDocument.documentElement.getCurrentTime()%32;document.getElementById('time').textContent=String(Math.floor(t)).padStart(2,'0')+' / 32 s';document.querySelectorAll('[data-time]').forEach((b,i)=>b.classList.toggle('active',Math.floor(t/8)===i))},250)}</script></html>
